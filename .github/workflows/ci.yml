name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: 语法检查 + 真数据校验 + D1 接口验证
    runs-on: ubuntu-latest
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      # 项目本身零依赖，不用 npm install；wrangler 只在最后两步按需下载。
      - name: 语法检查
        run: |
          node --check dev-server.mjs
          node --check public/assets/app.js
          node --check public/assets/core.js
          node --check public/assets/university.js
          node --check public/assets/submit.js
          node --check public/assets/dorm-card.js
          node --check src/worker.js
          node --check scripts/build-data.mjs
          node --check scripts/csv-to-sql.mjs
          node --check scripts/export-static.mjs
          node --check scripts/local-d1.mjs
          node --check scripts/verify-d1.mjs
          node --check scripts/verify-static-data.mjs
          node --check scripts/lib/data-model.mjs

      # public/data 里放的是 export-static.mjs 导出的浙江真数据，不是 build-data.mjs 生成的假数据，
      # 所以这里直接读文件逐项校验（条数、结构、页面资源），而不是重新生成后比对。
      - name: 校验仓库里的真实录取数据（public/data）
        run: node scripts/verify-static-data.mjs

      # 假数据仍然有用：下面的 D1 接口验证跑的就是它。这里只确认种子文件还是最新的。
      - name: 确认假数据种子 schema/02_seed.sql 与脚本一致
        run: |
          node scripts/build-data.mjs
          git diff --exit-code -- schema/02_seed.sql

      - name: 建表并灌入假数据（本地 D1，不需要 Cloudflare 账号）
        run: |
          npx --yes wrangler@4 d1 execute gaokao --local --file=./schema/01_schema.sql
          npx --yes wrangler@4 d1 execute gaokao --local --file=./schema/02_seed.sql

      - name: 验证查询 / 结果 / 推荐三个接口
        run: node scripts/verify-d1.mjs
