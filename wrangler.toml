name = "gaokao-volunteer"
main = "src/worker.js"
compatibility_date = "2025-01-01"

# 静态页面（public/）由 Workers 静态资源托管；/api/* 走 Worker 里的接口。
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

# D1 数据库：先执行 npx wrangler d1 create gaokao，再把返回的 database_id 填进来。
[[d1_databases]]
binding = "DB"
database_name = "gaokao"
database_id = "REPLACE_WITH_YOUR_D1_DATABASE_ID"

[observability]
enabled = true
